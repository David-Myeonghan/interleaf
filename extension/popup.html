<!doctype html>
<meta charset="utf-8">
<title>SnapNote</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 -apple-system, system-ui, sans-serif; margin: 0; width: 260px; }
  header { padding: 12px 14px 8px; font-weight: 600; }
  main { padding: 0 14px 14px; }
  button { font: inherit; width: 100%; padding: 8px; cursor: pointer; border-radius: 6px; border: 1px solid #bbb; background: #fafafa; }
  button:hover { background: #f0f0f0; }
  button[disabled] { opacity: .6; cursor: progress; }
  #status { margin-top: 10px; color: #555; min-height: 2.4em; }
  #status.bad { color: #c00; }
</style>
<header>SnapNote</header>
<main>
  <button id="capture">이 페이지 저장</button>
  <div id="status"></div>
</main>
<script src="popup.js"></script>
