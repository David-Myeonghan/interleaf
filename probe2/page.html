<!doctype html>
<meta charset="utf-8">
<title>handle transfer probe (file://)</title>
<style>body{font:14px/1.7 system-ui;margin:40px auto;max-width:620px}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap}</style>
<h1>Handle transfer probe</h1>
<p>이 페이지는 <code>file://</code> 로 열려야 한다. 팝업에서 폴더를 먼저 고른 뒤 아래 버튼을 누른다.</p>
<button id="ask">익스텐션에서 폴더 기억 받아오기</button>
<pre id="out">대기</pre>
<script>
const out = document.getElementById('out');
const log = (o) => { out.textContent = JSON.stringify(o, null, 2); window.__PROBE2 = o; };
const found = { runtime: null, handleReceived: false, handleName: null, canWrite: null };
window.addEventListener('message', async (e) => {
  if (e.source !== window) return;
  if (e.data?.__probe === 'report') { found.runtime = e.data; log(found); }
  if (e.data?.__probe === 'handle') {
    const h = e.data.handle;
    found.handleReceived = !!h;
    found.handleName = h && h.name;
    found.isDirHandle = !!(h && typeof h.getFileHandle === 'function');
    try {
      const perm = await h.queryPermission({ mode: 'readwrite' });
      found.permission = perm;
      if (perm !== 'granted') {
        const asked = await h.requestPermission({ mode: 'readwrite' });
        found.permissionAfterRequest = asked;
      }
      const fh = await h.getFileHandle('probe2-write.txt', { create: true });
      const w = await fh.createWritable();
      await w.write('written from file:// at ' + new Date().toISOString());
      await w.close();
      found.canWrite = true;
    } catch (err) {
      found.canWrite = err.name + ': ' + err.message;
    }
    log(found);
  }
});
document.getElementById('ask').onclick = () => window.postMessage({ __probe: 'want-handle' }, '*');
</script>
